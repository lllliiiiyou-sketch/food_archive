const STORAGE_KEY = "misikilji-restaurants-v1";
function loadRestaurants() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length) return parsed;
    }
  } catch (e) {
    /* ignore corrupt storage and fall back to sample data */
  }
  return initialRestaurants;
}

function Stars({ value, size = 15, showValue = true }) {
  const pct = Math.max(0, Math.min(100, (value / 5) * 100));
  return (
    <span className="inline-flex items-center gap-1">
      <span className="relative inline-flex" style={{ lineHeight: 0 }}>
        <span className="inline-flex" style={{ color: C.paperDeep }}>
          {Array.from({ length: 5 }).map((_, i) => (
            <Icon name="star" key={i} width={size} height={size} fill="currentColor" stroke="none" />
          ))}
        </span>
        <span
          className="absolute top-0 left-0 inline-flex overflow-hidden"
          style={{ width: `${pct}%`, color: C.gold }}
        >
          {Array.from({ length: 5 }).map((_, i) => (
            <Icon name="star" key={i} width={size} height={size} fill="currentColor" stroke="none" />
          ))}
        </span>
      </span>
      {showValue && (
        <span className="font-mono text-xs" style={{ color: C.inkSoft }}>{value.toFixed(1)}</span>
      )}
    </span>
  );
}

/* ---------------------------------------------------------------
   Mock map (schematic Seoul — not to geographic scale)
---------------------------------------------------------------- */
function MockMap({ restaurants, selectedId, hoveredId, onSelectMarker, focus, previewId, onClosePreview, onOpenDetail }) {
  const preview = restaurants.find((r) => r.id === previewId);
  const scale = focus ? 1.9 : 1;
  const cx = focus ? focus.x : 50;
  const cy = focus ? focus.y : 40;
  const originStyle = { transformOrigin: `${cx}% ${cy}%` };

  return (
    <div
      className="relative w-full h-full overflow-hidden"
      style={{
        background: `repeating-linear-gradient(0deg, ${C.lineStrong}22 0px, ${C.lineStrong}22 1px, transparent 1px, transparent 28px),
                      repeating-linear-gradient(90deg, ${C.lineStrong}22 0px, ${C.lineStrong}22 1px, transparent 1px, transparent 28px),
                      ${C.paperAlt}`,
      }}
    >
      <div
        className="absolute inset-0 transition-transform duration-700 ease-out"
        style={{ transform: `scale(${scale})`, ...originStyle }}
      >
        {/* river */}
        <svg className="absolute inset-0 w-full h-full" viewBox="0 0 100 80" preserveAspectRatio="none" style={{ pointerEvents: "none" }}>
          <path
            d="M -5 58 C 20 50, 35 62, 50 55 C 68 47, 80 60, 105 52 L 105 68 C 80 76, 68 63, 50 71 C 35 78, 20 66, -5 74 Z"
            fill={C.navyPale}
            opacity="0.9"
          />
          <text x="8" y="72" fontSize="2.6" fill={C.navySoft} opacity="0.6" style={{ fontFamily: "serif" }}>한강</text>
        </svg>

        {/* neighborhood soft labels */}
        {Object.entries(REGIONS).map(([gu, dongs]) => {
          const pts = dongs.map((d) => DONG_CENTERS[`${gu}-${d}`]).filter(Boolean);
          const gx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
          const gy = pts.reduce((s, p) => s + p.y, 0) / pts.length;
          return (
            <div
              key={gu}
              className="absolute text-xs font-medium select-none"
              style={{ left: `${gx}%`, top: `${gy - 9}%`, color: C.inkFaint, transform: "translate(-50%,-50%)" }}
            >
              {gu}
            </div>
          );
        })}

        {/* markers */}
        {restaurants.map((r) => {
          const active = r.id === selectedId || r.id === hoveredId;
          return (
            <button
              key={r.id}
              onClick={() => onSelectMarker(r.id)}
              className="absolute flex items-center justify-center rounded-full transition-transform duration-150"
              style={{
                left: `${r.x}%`,
                top: `${r.y}%`,
                width: active ? 34 : 26,
                height: active ? 34 : 26,
                transform: "translate(-50%,-100%)",
                background: active ? C.navy : "#FFFFFF",
                border: `2px solid ${active ? C.gold : C.navy}`,
                color: active ? "#fff" : C.navy,
                boxShadow: "0 1px 3px rgba(36,32,23,0.25)",
                zIndex: active ? 20 : 10,
              }}
              aria-label={r.name}
              title={r.name}
            >

  );

/* ---------------------------------------------------------------
   Add / Edit form modal
---------------------------------------------------------------- */
function RestaurantForm({ initial, onCancel, onSave }) {
  const isEdit = !!initial;
  const [name, setName] = useState(initial?.name || "");
  const [address, setAddress] = useState(initial?.address || "");
  const [gu, setGu] = useState(initial?.gu || "");
  const [dong, setDong] = useState(initial?.dong || "");
  const [category, setCategory] = useState(initial?.category || "");
  const [visitDate, setVisitDate] = useState(initial?.visitDate || todayStr());
  const [rating, setRating] = useState(initial?.rating ?? 4);
  const [oneLiner, setOneLiner] = useState(initial?.oneLiner || "");
  const [review, setReview] = useState(initial?.review || "");
  const [revisit, setRevisit] = useState(initial?.revisit || "maybe");
  const [menus, setMenus] = useState(initial?.menus?.length ? initial.menus : [{ id: uid("m"), name: "", price: "", isSignature: true }]);
  const [photos, setPhotos] = useState(initial?.photos || []);
  const [errors, setErrors] = useState({});
  const fileRef = useRef(null);

  const updateMenu = (id, patch) => setMenus((ms) => ms.map((m) => (m.id === id ? { ...m, ...patch } : m)));
  const addMenu = () => setMenus((ms) => [...ms, { id: uid("m"), name: "", price: "", isSignature: false }]);
  const removeMenu = (id) => setMenus((ms) => (ms.length > 1 ? ms.filter((m) => m.id !== id) : ms));
  const setSignature = (id) => setMenus((ms) => ms.map((m) => ({ ...m, isSignature: m.id === id })));

  const handleFiles = (fileList) => {
    const files = Array.from(fileList).slice(0, 8);
    files.forEach((file) => {
      const reader = new FileReader();
      reader.onload = () => {
        setPhotos((ps) => {
          const next = [...ps, { id: uid("p"), url: reader.result, type: "음식", isMain: ps.length === 0 }];
          return next;
        });
      };
      reader.readAsDataURL(file);
    });
  };
  const setMainPhoto = (id) => setPhotos((ps) => ps.map((p) => ({ ...p, isMain: p.id === id })));
  const setPhotoType = (id, type) => setPhotos((ps) => ps.map((p) => (p.id === id ? { ...p, type } : p)));
  const removePhoto = (id) => setPhotos((ps) => {
    const next = ps.filter((p) => p.id !== id);
    if (next.length && !next.some((p) => p.isMain)) next[0].isMain = true;
    return next;
  });

  const validate = () => {
    const e = {};
    if (!name.trim()) e.name = "식당명을 입력해 주세요.";
    if (!address.trim()) e.address = "주소를 입력해 주세요.";
    if (!gu) e.gu = "구를 선택해 주세요.";
    if (!dong) e.dong = "동을 선택해 주세요.";
    if (!category) e.category = "카테고리를 선택해 주세요.";
    if (!visitDate) e.visitDate = "방문일을 입력해 주세요.";
    const validMenus = menus.filter((m) => m.name.trim() && m.price !== "");
    if (validMenus.length === 0) e.menus = "메뉴를 최소 1개 이상 입력해 주세요.";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const submit = () => {
    if (!validate()) return;
    const cleanMenus = menus.filter((m) => m.name.trim() && m.price !== "").map((m) => ({ ...m, price: Number(m.price) }));
    const center = DONG_CENTERS[`${gu}-${dong}`] || { x: 50, y: 40 };
    const payload = {
      id: initial?.id || uid("r"),
      name: name.trim(), address: address.trim(), gu, dong,
      x: initial?.x ?? center.x + (Math.random() * 2 - 1),
      y: initial?.y ?? center.y + (Math.random() * 2 - 1),
      category, visitDate,
      createdAt: initial?.createdAt || todayStr(), updatedAt: todayStr(),
      rating: Number(rating), oneLiner: oneLiner.trim(), review: review.trim(), revisit,
      menus: cleanMenus,
      photos: photos.length ? photos : [photo(`${name || "new"}-${Date.now()}`, "음식", true)],
    };
    onSave(payload);
  };

  const field = (label, required, err, children) => (
    <div className="mb-3">
      <label className="text-xs font-medium mb-1 flex items-center gap-1" style={{ color: C.inkSoft }}>
        {label}
        {required && <span className="inline-block rounded-full" style={{ width: 4, height: 4, background: C.clay }} />}
      </label>
      {children}
      {err && <p className="text-xs mt-1" style={{ color: C.clay }}>{err}</p>}
    </div>
  );

  const inputStyle = { background: C.paper, border: `1px solid ${C.line}`, color: C.ink };

  return (
    <div className="fixed inset-0 z-50 flex items-stretch md:items-center justify-center" style={{ background: "rgba(36,32,23,0.45)" }}>
      <div
        className="w-full md:max-w-2xl md:rounded-2xl overflow-y-auto"
        style={{ background: C.paper, maxHeight: "100vh" }}
      >
        <div className="sticky top-0 flex items-center justify-between px-5 py-4 z-10" style={{ background: C.paper, borderBottom: `1px solid ${C.line}` }}>
          <p className="font-display text-lg font-semibold" style={{ color: C.ink }}>{isEdit ? "맛집 수정" : "맛집 추가"}</p>
          <button onClick={onCancel} aria-label="닫기"><Icon name="x" width={20} height={20} style={{ color: C.inkFaint }} /></button>
        </div>

        <div className="px-5 py-4">
          {field("식당명", true, errors.name, (
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="예: 연남 온기"
              className="w-full rounded-lg px-3 py-2 text-sm" style={inputStyle} />
          ))}
          {field("주소", true, errors.address, (
            <input value={address} onChange={(e) => setAddress(e.target.value)} placeholder="도로명 또는 지번 주소"
              className="w-full rounded-lg px-3 py-2 text-sm" style={inputStyle} />
          ))}

          <div className="grid grid-cols-2 gap-3">
            {field("구", true, errors.gu, (
              <select value={gu} onChange={(e) => { setGu(e.target.value); setDong(""); }} className="w-full rounded-lg px-3 py-2 text-sm" style={inputStyle}>
                <option value="">선택</option>
                {Object.keys(REGIONS).map((g) => <option key={g} value={g}>{g}</option>)}
              </select>
            ))}
            {field("동", true, errors.dong, (
              <select value={dong} onChange={(e) => setDong(e.target.value)} disabled={!gu} className="w-full rounded-lg px-3 py-2 text-sm" style={inputStyle}>
                <option value="">선택</option>
                {(REGIONS[gu] || []).map((d) => <option key={d} value={d}>{d}</option>)}
              </select>
            ))}
          </div>

          <div className="grid grid-cols-2 gap-3">
            {field("음식 카테고리", true, errors.category, (
              <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full rounded-lg px-3 py-2 text-sm" style={inputStyle}>
                <option value="">선택</option>
                {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
            ))}
            {field("방문일", true, errors.visitDate, (
              <input type="date" value={visitDate} onChange={(e) => setVisitDate(e.target.value)} className="w-full rounded-lg px-3 py-2 text-sm" style={inputStyle} />
            ))}
          </div>

          {field("메뉴 및 가격", true, errors.menus, (
            <div className="space-y-2">
              {menus.map((m) => (
                <div key={m.id} className="flex items-center gap-2">
                  <button
                    onClick={() => setSignature(m.id)}
                    title="대표 메뉴로 지정"
                    className="shrink-0 rounded-full p-1.5"
                    style={{ background: m.isSignature ? C.goldPale : C.paperAlt, color: m.isSignature ? C.gold : C.inkFaint }}
                  >
                    <Icon name="star" width={14} height={14} fill={m.isSignature ? "currentColor" : "none"} />
                  </button>
                  <input
                    value={m.name} onChange={(e) => updateMenu(m.id, { name: e.target.value })}
                    placeholder="메뉴명" className="flex-1 min-w-0 rounded-lg px-3 py-2 text-sm" style={inputStyle}
                  />
                  <input
                    value={m.price} onChange={(e) => updateMenu(m.id, { price: e.target.value.replace(/[^0-9]/g, "") })}
                    placeholder="가격" inputMode="numeric" className="w-24 rounded-lg px-3 py-2 text-sm font-mono" style={inputStyle}
                  />
                  <button onClick={() => removeMenu(m.id)} aria-label="메뉴 삭제" className="shrink-0 p-1.5">
                    <Icon name="trash2" width={15} height={15} style={{ color: C.inkFaint }} />
                  </button>
                </div>
              ))}
              <button onClick={addMenu} className="text-xs font-medium rounded-full px-3 py-1.5 inline-flex items-center gap-1" style={{ background: C.paperAlt, color: C.navy }}>
                <Icon name="plus" width={13} height={13} /> 메뉴 추가
              </button>
            </div>
          ))}

          {field("사진", false, null, (
            <div>
              <div className="flex flex-wrap gap-2 mb-2">
                {photos.map((p) => (
                  <div key={p.id} className="relative rounded-lg overflow-hidden" style={{ width: 92, border: `1px solid ${C.line}` }}>
                    <img src={p.url} alt="" style={{ width: 92, height: 70, objectFit: "cover" }} />
                    <button
                      onClick={() => removePhoto(p.id)}
                      className="absolute top-1 right-1 rounded-full flex items-center justify-center"
                      style={{ width: 18, height: 18, background: "rgba(36,32,23,0.7)", color: "#fff" }}
                    >
                      <Icon name="x" width={11} height={11} />
                    </button>
                    <button
                      onClick={() => setMainPhoto(p.id)}
                      className="absolute bottom-1 left-1 rounded-full px-1.5 py-0.5 text-[10px] font-medium"
                      style={{ background: p.isMain ? C.gold : "rgba(255,255,255,0.9)", color: p.isMain ? "#fff" : C.inkSoft }}
                    >
                      대표
                    </button>
                    <select
                      value={p.type} onChange={(e) => setPhotoType(p.id, e.target.value)}
                      className="w-full text-[10px] px-1 py-0.5"
                      style={{ background: "#fff", borderTop: `1px solid ${C.line}`, color: C.inkSoft }}
                    >
                      {["음식", "메뉴판", "내부", "외관", "기타"].map((t) => <option key={t} value={t}>{t}</option>)}
                    </select>
                  </div>
                ))}
                <button
                  onClick={() => fileRef.current?.click()}
                  className="flex flex-col items-center justify-center gap-1 rounded-lg"
                  style={{ width: 92, height: 70, border: `1px dashed ${C.lineStrong}`, color: C.inkFaint }}
                >
                  <Icon name="imagePlus" width={18} height={18} />
                  <span className="text-[10px]">사진 추가</span>
                </button>
                <input ref={fileRef} type="file" accept="image/*" multiple className="hidden" onChange={(e) => e.target.files && handleFiles(e.target.files)} />
              </div>
              <p className="text-xs" style={{ color: C.inkFaint }}>여러 장 업로드 가능 · 하나를 대표 사진으로 지정하세요.</p>
            </div>
          ))}

          {field(`개인 평점 (${Number(rating).toFixed(1)} / 5.0)`, true, null, (
            <div className="flex items-center gap-3">
              <input type="range" min="0" max="5" step="0.5" value={rating} onChange={(e) => setRating(e.target.value)} className="flex-1" />
              <Stars value={Number(rating)} size={16} showValue={false} />
            </div>
          ))}

          {field("한줄평", false, null, (
            <input value={oneLiner} onChange={(e) => setOneLiner(e.target.value)} placeholder="이 맛집을 한 문장으로 표현하면?"
              className="w-full rounded-lg px-3 py-2 text-sm" style={inputStyle} />
          ))}
          {field("상세 리뷰", false, null, (
            <textarea value={review} onChange={(e) => setReview(e.target.value)} rows={4} placeholder="맛, 분위기, 서비스 등 자유롭게 기록해 보세요."
              className="w-full rounded-lg px-3 py-2 text-sm resize-none" style={inputStyle} />
          ))}

          {field("재방문 의사", false, null, (
            <div className="flex gap-2">
              {[{ v: "yes", l: "또 갈래요" }, { v: "maybe", l: "글쎄요" }, { v: "no", l: "아마 안 갈래요" }].map((o) => (
                <button
                  key={o.v}
                  onClick={() => setRevisit(o.v)}
                  className="rounded-full px-3 py-1.5 text-xs font-medium"
                  style={{ background: revisit === o.v ? C.navy : C.paperAlt, color: revisit === o.v ? "#fff" : C.inkSoft }}
                >
                  {o.l}
                </button>
              ))}
            </div>
          ))}
        </div>

        <div className="sticky bottom-0 flex items-center justify-end gap-2 px-5 py-4" style={{ background: C.paper, borderTop: `1px solid ${C.line}` }}>
          <button onClick={onCancel} className="rounded-full px-4 py-2 text-sm font-medium" style={{ color: C.inkSoft }}>취소</button>
          <button onClick={submit} className="rounded-full px-4 py-2 text-sm font-medium inline-flex items-center gap-1.5" style={{ background: C.navy, color: "#fff" }}>
            <Icon name="check" width={15} height={15} /> {isEdit ? "수정 완료" : "등록하기"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   Detail panel
---------------------------------------------------------------- */
function DetailPanel({ r, onClose, onEdit, onDelete }) {
  const [activePhoto, setActivePhoto] = useState(mainPhoto(r)?.id);
  const current = r.photos.find((p) => p.id === activePhoto) || mainPhoto(r);

  return (
    <div className="fixed inset-0 z-50 flex justify-end" style={{ background: "rgba(36,32,23,0.4)" }} onClick={onClose}>
      <div
        className="w-full md:w-[460px] h-full overflow-y-auto"
        style={{ background: C.paper }}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="sticky top-0 flex items-center justify-between px-4 py-3 z-10" style={{ background: C.paper, borderBottom: `1px solid ${C.line}` }}>
          <button onClick={onClose} className="flex items-center gap-1 text-sm font-medium" style={{ color: C.inkSoft }}>
            <Icon name="arrowLeft" width={16} height={16} /> 닫기
          </button>
          <div className="flex items-center gap-2">
            <button onClick={() => onEdit(r)} className="flex items-center gap-1 rounded-full px-3 py-1.5 text-xs font-medium" style={{ background: C.navyPale, color: C.navy }}>
              <Icon name="pencil" width={13} height={13} /> 수정
            </button>
            <button onClick={() => onDelete(r)} className="flex items-center gap-1 rounded-full px-3 py-1.5 text-xs font-medium" style={{ background: C.clayPale, color: C.clay }}>
              <Icon name="trash2" width={13} height={13} /> 삭제
            </button>
          </div>
        </div>

        <img src={current?.url} alt={r.name} className="w-full object-cover" style={{ height: 240 }} />
        {r.photos.length > 1 && (
          <div className="flex gap-2 px-4 py-2 overflow-x-auto">
            {r.photos.map((p) => (
              <button key={p.id} onClick={() => setActivePhoto(p.id)} className="shrink-0 rounded-lg overflow-hidden" style={{ border: p.id === activePhoto ? `2px solid ${C.navy}` : `1px solid ${C.line}` }}>
                <img src={p.url} alt={p.type} style={{ width: 58, height: 44, objectFit: "cover" }} />
              </button>
            ))}
          </div>
        )}

        <div className="px-5 pt-3 pb-6">
          <div className="flex items-start justify-between gap-2">
            <h2 className="font-display text-xl font-semibold" style={{ color: C.ink }}>{r.name}</h2>
            <RevisitBadge revisit={r.revisit} />
          </div>
          <div className="flex items-center gap-2 mt-1.5">
            <Stars value={r.rating} size={16} />
            <span className="text-xs" style={{ color: C.inkFaint }}>·</span>
            <span className="text-xs font-medium" style={{ color: C.inkSoft }}>{r.category}</span>
            <span className="text-xs" style={{ color: C.inkFaint }}>·</span>
            <span className="text-xs" style={{ color: C.inkSoft }}>{r.gu} {r.dong}</span>
          </div>
          {r.oneLiner && <p className="font-display italic text-sm mt-2" style={{ color: C.inkSoft }}>"{r.oneLiner}"</p>}

          <div className="mt-5">
            <p className="text-xs font-semibold mb-2 uppercase tracking-wide" style={{ color: C.inkFaint }}>메뉴</p>
            <div className="rounded-xl overflow-hidden" style={{ border: `1px solid ${C.line}` }}>
              {r.menus.map((m, i) => (
                <div key={m.id} className="flex items-center justify-between px-3 py-2" style={{ background: i % 2 ? C.paperAlt : "#fff" }}>
                  <span className="text-sm flex items-center gap-1.5" style={{ color: C.ink }}>
                    {m.isSignature && <Icon name="star" width={13} height={13} fill={C.gold} stroke="none" />} {m.name}
                  </span>
                  <span className="text-sm font-mono" style={{ color: C.navy }}>{won(m.price)}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="mt-5">
            <p className="text-xs font-semibold mb-2 uppercase tracking-wide" style={{ color: C.inkFaint }}>나의 평가</p>
            <p className="text-sm leading-relaxed" style={{ color: C.ink }}>{r.review || "작성된 상세 리뷰가 없습니다."}</p>
          </div>

          <div className="mt-5 grid grid-cols-2 gap-3">
            <div className="rounded-xl p-3" style={{ background: C.paperAlt }}>
              <p className="text-xs font-semibold mb-1 flex items-center gap-1" style={{ color: C.inkFaint }}><Icon name="calendar" width={12} height={12} /> 방문일</p>
              <p className="text-sm font-mono" style={{ color: C.ink }}>{r.visitDate}</p>
            </div>
            <div className="rounded-xl p-3" style={{ background: C.paperAlt }}>
              <p className="text-xs font-semibold mb-1 flex items-center gap-1" style={{ color: C.inkFaint }}><Icon name="navigation" width={12} height={12} /> 위치</p>
              <p className="text-sm" style={{ color: C.ink }}>{r.address}</p>
            </div>
          </div>

          <div className="mt-3 rounded-xl overflow-hidden" style={{ height: 140, border: `1px solid ${C.line}` }}>
            <MockMap
              restaurants={[r]}
              selectedId={r.id}
              hoveredId={null}
              onSelectMarker={() => {}}
              focus={{ x: r.x, y: r.y }}
              previewId={null}
              onClosePreview={() => {}}
              onOpenDetail={() => {}}
            />
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   Confirm dialog
---------------------------------------------------------------- */
function ConfirmDialog({ target, onCancel, onConfirm }) {
  return (
    <div className="fixed inset-0 z-[60] flex items-center justify-center px-4" style={{ background: "rgba(36,32,23,0.5)" }}>
      <div className="rounded-2xl p-5 w-full" style={{ background: "#fff", maxWidth: 340 }}>
        <p className="font-display font-semibold text-base mb-1" style={{ color: C.ink }}>맛집 기록을 삭제할까요?</p>
        <p className="text-sm mb-4" style={{ color: C.inkSoft }}>'{target.name}' 기록이 영구히 삭제되며 되돌릴 수 없습니다.</p>
        <div className="flex justify-end gap-2">
          <button onClick={onCancel} className="rounded-full px-4 py-2 text-sm font-medium" style={{ color: C.inkSoft }}>취소</button>
          <button onClick={onConfirm} className="rounded-full px-4 py-2 text-sm font-medium" style={{ background: C.clay, color: "#fff" }}>삭제</button>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   App
---------------------------------------------------------------- */
function FoodArchiveApp() {
  const [restaurants, setRestaurants] = useState(loadRestaurants);
  const [gu, setGu] = useState(null);
  const [dong, setDong] = useState(null);
  const [query, setQuery] = useState("");
  const [filters, setFilters] = useState({ category: null, minRating: 0, price: null, revisit: null });
  const [filterOpen, setFilterOpen] = useState(false);

  const [selectedId, setSelectedId] = useState(null);
  const [hoveredId, setHoveredId] = useState(null);
  const [previewId, setPreviewId] = useState(null);
  const [detailId, setDetailId] = useState(null);

  const [formOpen, setFormOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [sheetExpanded, setSheetExpanded] = useState(false);

  const filtered = useMemo(() => {
    return restaurants.filter((r) => {
      if (gu && r.gu !== gu) return false;
      if (dong && r.dong !== dong) return false;
      if (filters.category && r.category !== filters.category) return false;
      if (filters.minRating && r.rating < filters.minRating) return false;
      if (filters.price && priceBucketOf(avgPrice(r)) !== filters.price) return false;
      if (filters.revisit && r.revisit !== filters.revisit) return false;
      if (query.trim()) {
        const q = query.trim().toLowerCase();
        const hay = [r.name, r.gu, r.dong, ...r.menus.map((m) => m.name)].join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }, [restaurants, gu, dong, filters, query]);

  const focus = dong ? DONG_CENTERS[`${gu}-${dong}`] : gu
    ? (() => {
        const pts = (REGIONS[gu] || []).map((d) => DONG_CENTERS[`${gu}-${d}`]).filter(Boolean);
        if (!pts.length) return null;
        return { x: pts.reduce((s, p) => s + p.x, 0) / pts.length, y: pts.reduce((s, p) => s + p.y, 0) / pts.length };
      })()
    : null;

  const detailRestaurant = restaurants.find((r) => r.id === detailId);
  const activeCount = Object.values(filters).filter((v) => v !== null && v !== 0).length;

  useEffect(() => {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(restaurants));
    } catch (e) {
      /* storage full or unavailable — app still works, just won't persist */
    }
  }, [restaurants]);

  const resetToSampleData = () => {
    if (!window.confirm("현재 기록을 모두 지우고 샘플 데이터로 되돌릴까요? 이 작업은 되돌릴 수 없습니다.")) return;
    setRestaurants(initialRestaurants);
    setSelectedId(null);
    setDetailId(null);
    setPreviewId(null);
  };


  const selectMarker = (id) => { setSelectedId(id); setPreviewId(id); };
  const openDetail = (id) => { setDetailId(id); setPreviewId(null); };

  const saveRestaurant = (payload) => {
    setRestaurants((rs) => {
      const exists = rs.some((r) => r.id === payload.id);
      return exists ? rs.map((r) => (r.id === payload.id ? payload : r)) : [payload, ...rs];
    });
    setFormOpen(false);
    setEditing(null);
    setDetailId(payload.id);
  };

  const confirmDelete = () => {
    setRestaurants((rs) => rs.filter((r) => r.id !== deleteTarget.id));
    if (detailId === deleteTarget.id) setDetailId(null);
    setDeleteTarget(null);
  };

  return (
    <div className="w-full h-screen flex flex-col font-body" style={{ background: C.paper, color: C.ink }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
        .font-display { font-family: 'Fraunces', serif; }
        .font-body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        * { box-sizing: border-box; }
        input, select, textarea { outline: none; font-family: 'Inter', sans-serif; }
        input:focus, select:focus, textarea:focus { border-color: ${C.navy} !important; }
        input[type=range] { accent-color: ${C.navy}; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: ${C.lineStrong}; border-radius: 8px; }
      `}</style>

      {/* header */}
      <header className="shrink-0 px-4 md:px-6 py-3 flex flex-col gap-2.5" style={{ borderBottom: `1px solid ${C.line}`, background: C.paper }}>
        <div className="flex items-center justify-between gap-3 flex-wrap">
          <div className="flex items-center gap-2 shrink-0">
            <div className="rounded-lg flex items-center justify-center font-display font-semibold" style={{ width: 32, height: 32, background: C.navy, color: "#fff", fontSize: 14 }}>
              미
            </div>
            <div>
              <p className="font-display font-semibold text-base leading-none" style={{ color: C.ink }}>미식일지</p>
              <p className="text-[11px] leading-none mt-0.5" style={{ color: C.inkFaint }}>Personal Food Archive</p>
            </div>
          </div>

          <div className="flex-1 min-w-[200px] flex items-center gap-2 max-w-md">
            <div className="flex-1 flex items-center gap-2 rounded-full px-3 py-1.5" style={{ background: C.paperAlt }}>
              <Icon name="search" width={15} height={15} style={{ color: C.inkFaint }} />
              <input
                value={query} onChange={(e) => setQuery(e.target.value)}
                placeholder="식당명, 지역, 메뉴로 검색"
                className="flex-1 bg-transparent text-sm"
                style={{ color: C.ink }}
              />
              {query && <button onClick={() => setQuery("")}><Icon name="x" width={14} height={14} style={{ color: C.inkFaint }} /></button>}
            </div>
            <div className="relative">
              <button
                onClick={() => setFilterOpen((v) => !v)}
                className="flex items-center gap-1 rounded-full px-3 py-1.5 text-sm font-medium relative"
                style={{ background: activeCount ? C.navyPale : C.paperAlt, color: activeCount ? C.navy : C.inkSoft }}
              >
                <Icon name="slidersHorizontal" width={14} height={14} /> 필터
                {activeCount > 0 && (
                  <span className="rounded-full flex items-center justify-center text-[10px] font-semibold" style={{ width: 15, height: 15, background: C.navy, color: "#fff" }}>
                    {activeCount}
                  </span>
                )}
              </button>
              {filterOpen && (
                <FilterPanel
                  filters={filters}
                  setFilters={setFilters}
                  onResetRegion={() => { setGu(null); setDong(null); }}
                  onClose={() => setFilterOpen(false)}
                />
              )}
            </div>
          </div>

          <button
            onClick={() => { setEditing(null); setFormOpen(true); }}
            className="shrink-0 flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-medium"
            style={{ background: C.navy, color: "#fff" }}
          >
            <Icon name="plus" width={15} height={15} /> 맛집 추가
          </button>
        </div>

        <RegionBreadcrumb
          gu={gu} dong={dong}
          onSetGu={(g) => { setGu(g); setDong(null); }}
          onSetDong={(d) => setDong(d)}
        />
      </header>

      {/* main */}
      <div className="flex-1 min-h-0 flex flex-col lg:flex-row relative">
        <div className="flex-1 min-h-0 relative">
          <MockMap
            restaurants={filtered}
            selectedId={selectedId}
            hoveredId={hoveredId}
            onSelectMarker={selectMarker}
            focus={focus}
            previewId={previewId}
            onClosePreview={() => setPreviewId(null)}
            onOpenDetail={openDetail}
          />
        </div>

        {/* desktop list */}
        <div className="hidden lg:flex flex-col shrink-0" style={{ width: 380, borderLeft: `1px solid ${C.line}`, background: C.paper }}>
          <div className="px-4 py-3 flex items-center justify-between" style={{ borderBottom: `1px solid ${C.line}` }}>
            <p className="text-sm font-semibold" style={{ color: C.ink }}>
              {dong ? `${gu} ${dong}` : gu || "서울 전체"}
            </p>
            <div className="flex items-center gap-2">
              <p className="text-xs font-mono" style={{ color: C.inkFaint }}>{filtered.length}곳</p>
              <button onClick={resetToSampleData} className="text-xs font-medium underline decoration-dotted" style={{ color: C.inkFaint }}>
                샘플로 초기화
              </button>
            </div>
          </div>
          <div className="flex-1 overflow-y-auto p-3 space-y-2">
            {filtered.length === 0 ? (
              <EmptyState onReset={() => { setGu(null); setDong(null); setFilters({ category: null, minRating: 0, price: null, revisit: null }); setQuery(""); }} />
            ) : (
              filtered.map((r) => (
                <RestaurantCard
                  key={r.id} r={r}
                  active={r.id === selectedId || r.id === hoveredId}
                  onHover={setHoveredId}
                  onSelect={selectMarker}
                  onOpenDetail={openDetail}
                />
              ))
            )}
          </div>
        </div>

        {/* mobile bottom sheet */}
        <div
          className="lg:hidden absolute left-0 right-0 bottom-0 rounded-t-2xl transition-transform duration-300"
          style={{
            background: C.paper,
            borderTop: `1px solid ${C.line}`,
            boxShadow: "0 -6px 20px rgba(36,32,23,0.15)",
            height: "72%",
            transform: sheetExpanded ? "translateY(0)" : "translateY(calc(100% - 56px))",
          }}
        >
          <button
            onClick={() => setSheetExpanded((v) => !v)}
            className="w-full flex flex-col items-center pt-2 pb-2.5"
          >
            <span className="rounded-full" style={{ width: 36, height: 4, background: C.lineStrong }} />
            <span className="text-xs font-semibold mt-1.5 flex items-center gap-1" style={{ color: C.ink }}>
              {sheetExpanded ? <Icon name="mapIcon" width={13} height={13} /> : <Icon name="listIcon" width={13} height={13} />}
              {sheetExpanded ? "지도 보기" : `리스트 보기 (${filtered.length})`}
            </span>
          </button>
          <div className="overflow-y-auto px-3 pb-4" style={{ height: "calc(100% - 48px)" }}>
            <div className="flex items-center justify-between px-1 pb-2">
              <p className="text-sm font-semibold" style={{ color: C.ink }}>
                {dong ? `${gu} ${dong}` : gu || "서울 전체"}
              </p>
              <button onClick={resetToSampleData} className="text-xs font-medium underline decoration-dotted" style={{ color: C.inkFaint }}>
                샘플로 초기화
              </button>
            </div>
            <div className="space-y-2">
              {filtered.length === 0 ? (
                <EmptyState onReset={() => { setGu(null); setDong(null); setFilters({ category: null, minRating: 0, price: null, revisit: null }); setQuery(""); }} />
              ) : (
                filtered.map((r) => (
                  <RestaurantCard
                    key={r.id} r={r}
                    active={r.id === selectedId}
                    onHover={() => {}}
                    onSelect={(id) => { selectMarker(id); setSheetExpanded(false); }}
                    onOpenDetail={openDetail}
                  />
                ))
              )}
            </div>
          </div>
        </div>
      </div>

      {detailRestaurant && (
        <DetailPanel
          r={detailRestaurant}
          onClose={() => setDetailId(null)}
          onEdit={(r) => { setEditing(r); setDetailId(null); setFormOpen(true); }}
          onDelete={(r) => setDeleteTarget(r)}
        />
      )}

      {formOpen && (
        <RestaurantForm
          initial={editing}
          onCancel={() => { setFormOpen(false); setEditing(null); }}
          onSave={saveRestaurant}
        />
      )}

      {deleteTarget && (
        <ConfirmDialog target={deleteTarget} onCancel={() => setDeleteTarget(null)} onConfirm={confirmDelete} />
      )}
    </div>
  );
}

function EmptyState({ onReset }) {
  return (
    <div className="flex flex-col items-center text-center py-10 px-4">
      <div className="rounded-full flex items-center justify-center mb-3" style={{ width: 44, height: 44, background: C.paperAlt }}>
        <Icon name="utensils" width={19} height={19} style={{ color: C.inkFaint }} />
      </div>
      <p className="text-sm font-semibold" style={{ color: C.ink }}>이 조건에 맞는 맛집이 없어요</p>
      <p className="text-xs mt-1 mb-3" style={{ color: C.inkSoft }}>지역이나 필터를 바꾸거나, 새 맛집을 기록해 보세요.</p>
      <button onClick={onReset} className="text-xs font-medium rounded-full px-3 py-1.5" style={{ background: C.navyPale, color: C.navy }}>
        전체 조건 초기화
      </button>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<FoodArchiveApp />);
</script>
